<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aston Villa FC</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<header class="hero">

    <h1>🏆 ASTON VILLA FC</h1>

    <p>Official Roblox Football Club</p>

    <input
        id="search"
        type="text"
        placeholder="🔍 Search player..."
    >

</header>

<section class="stats">

    <div class="stat">
        <h2>20</h2>
        <p>Players</p>
    </div>

    <div class="stat">
        <h2>2</h2>
        <p>Goalkeepers</p>
    </div>

    <div class="stat">
        <h2>6</h2>
        <p>Defenders</p>
    </div>

    <div class="stat">
        <h2>5</h2>
        <p>Midfielders</p>
    </div>

    <div class="stat">
        <h2>7</h2>
        <p>Attackers</p>
    </div>

</section>

<section>

<h2 class="title">👥 First Team Squad</h2>

<div id="players" class="players"></div>

</section>

<section>

<h2 class="title">📅 Upcoming Fixtures</h2>

<div id="fixtures"></div>

</section>

<section>

<h2 class="title">🏆 League Table</h2>

<div id="table"></div>

</section>

<section>

<h2 class="title">📰 Latest News</h2>

<div id="news"></div>

</section>

<section class="staff">

<h2 class="title">👑 Staff</h2>

<div class="staff-card">

<h3>Manager</h3>

<p>Zeltsx21 / Cris</p>

<hr>

<h3>Assistant Manager</h3>

<p>Vacant</p>

</div>

</section>

<script src="data/players.js"></script>
<script src="data/fixtures.js"></script>
<script src="data/table.js"></script>
<script src="data/news.js"></script>
<script src="script.js"></script>

</body>
</html>
